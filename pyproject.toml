[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "janvangen-stepcheck"
version = "0.1.0"
description = "检查 Markdown 文档里的 shell 步骤是否真的可执行"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "janvangen" }]
keywords = ["markdown", "lint", "documentation", "shell", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/janvangen/stepcheck"
Repository = "https://github.com/janvangen/stepcheck"
Issues = "https://github.com/janvangen/stepcheck/issues"

[project.scripts]
stepcheck = "stepcheck:main"

[tool.setuptools]
py-modules = ["stepcheck"]
